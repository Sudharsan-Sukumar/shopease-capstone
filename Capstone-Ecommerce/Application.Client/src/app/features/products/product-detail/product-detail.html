<main class="container py-4">
  <nav aria-label="breadcrumb">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a routerLink="/products">Catalog</a></li>
      <li class="breadcrumb-item active">{{ product()?.name ?? 'Product' }}</li>
    </ol>
  </nav>

  <div class="text-center py-5" *ngIf="loading()">
    <div class="spinner-border text-primary" role="status"></div>
  </div>

  <div class="empty-state" *ngIf="!loading() && notFound()">
    <div class="empty-icon"><i class="bi bi-exclamation-triangle"></i></div>
    <h5>Product not found</h5>
    <a routerLink="/products" class="btn btn-shopease mt-3">Back to Catalog</a>
  </div>

  <div class="row g-4" *ngIf="!loading() && product() as p">
    <div class="col-md-5">
      <div class="product-placeholder rounded" style="height: 350px; font-size: 5rem">
        <i class="bi bi-box-seam"></i>
      </div>
    </div>
    <div class="col-md-7">
      <span class="badge bg-light text-dark mb-2">{{ p.categoryName }}</span>
      <h2 class="fw-bold">{{ p.name }}</h2>
      <h3 class="text-primary fw-bold mb-3">&#8377;{{ p.price | number: '1.0-0' }}</h3>
      <div class="mb-3">
        <span class="badge bg-success fs-6" *ngIf="p.stock > 0">In Stock ({{ p.stock }})</span>
        <span class="badge bg-danger fs-6" *ngIf="p.stock <= 0">Out of Stock</span>
      </div>
      <p class="mb-4">{{ p.description }}</p>

      <div class="alert alert-success" *ngIf="addedMessage()">{{ addedMessage() }}</div>

      <div class="d-flex gap-3 align-items-center mb-4" *ngIf="p.stock > 0">
        <label class="fw-semibold">Qty:</label>
        <div class="quantity-control">
          <button (click)="changeQty(-1)">&minus;</button>
          <input type="number" [ngModel]="quantity()" (ngModelChange)="quantity.set($event)" min="1" [max]="p.stock" />
          <button (click)="changeQty(1)">+</button>
        </div>
      </div>

      <div class="d-flex gap-3 flex-wrap">
        <button class="btn btn-add-cart btn-lg" [disabled]="p.stock <= 0" (click)="addToCart()">
          <i class="bi bi-cart-plus"></i> Add to Cart
        </button>
        <a routerLink="/products" class="btn btn-outline-secondary btn-lg">
          <i class="bi bi-arrow-left"></i> Continue Shopping
        </a>
      </div>
    </div>
  </div>
</main>
