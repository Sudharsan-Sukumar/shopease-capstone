<!-- Navbar only shows once logged in - the login/register pages are
     standalone auth-wrapper screens, matching the ShopEase prototype.
     Two DIFFERENT flat nav blocks below (not one shared bar with an admin
     dropdown bolted on) - matches the prototype, which gives Admin a wholly
     separate console navbar (Dashboard/Products/Users/Content/Reports, all
     flat links) instead of merging it into the customer shopping nav. A
     staff-only account (the common case - e.g. the seeded Admin has no
     Customer role) never sees Catalog/Cart/My Orders at all; a dual-role
     account (staff + Customer) sees both blocks. -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top" *ngIf="auth.isLoggedIn()">
  <div class="container">
    <a class="navbar-brand" [routerLink]="auth.isStaff() ? '/admin/dashboard' : '/products'">
      <i class="bi bi-bag-heart-fill brand-icon"></i> ShopEase
      <span class="badge bg-warning text-dark" *ngIf="auth.isStaff()">Admin</span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav me-auto">
        <ng-container *ngIf="auth.isStaff()">
          <li class="nav-item">
            <a class="nav-link" routerLink="/admin/dashboard" routerLinkActive="active"><i class="bi bi-speedometer2"></i> Dashboard</a>
          </li>
          <li class="nav-item" *ngIf="auth.canManageProducts()">
            <a class="nav-link" routerLink="/admin/products" routerLinkActive="active"><i class="bi bi-box-seam"></i> Manage Products</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/admin/users" routerLinkActive="active"><i class="bi bi-people"></i> Manage Users</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/admin/content" routerLinkActive="active"><i class="bi bi-layout-text-window-reverse"></i> Content</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/admin/reports" routerLinkActive="active"><i class="bi bi-clipboard-data"></i> Reports</a>
          </li>
        </ng-container>
        <ng-container *ngIf="auth.isCustomer()">
          <li class="nav-item">
            <a class="nav-link" routerLink="/products" routerLinkActive="active"><i class="bi bi-grid"></i> Catalog</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/orders" routerLinkActive="active"><i class="bi bi-bag"></i> My Orders</a>
          </li>
        </ng-container>
      </ul>
      <ul class="navbar-nav">
        <li class="nav-item" *ngIf="auth.isCustomer()">
          <a class="nav-link" routerLink="/cart" routerLinkActive="active">
            <span class="nav-icon-wrapper">
              <i class="bi bi-cart3"></i>
              <span class="badge bg-danger rounded-pill" *ngIf="cart.itemCount() > 0">{{ cart.itemCount() }}</span>
            </span>
          </a>
        </li>
        <li class="nav-item">
          <span class="nav-link">
            <i class="bi bi-person-circle"></i> {{ auth.user()?.fullName }}
            <span class="badge bg-warning text-dark" *ngFor="let role of auth.user()?.roles" [hidden]="role === 'Customer'">{{ role }}</span>
          </span>
        </li>
        <li class="nav-item">
          <button class="nav-link btn btn-link" (click)="logout()"><i class="bi bi-box-arrow-right"></i> Logout</button>
        </li>
      </ul>
    </div>
  </div>
</nav>

<router-outlet></router-outlet>
